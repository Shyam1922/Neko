# Re-checks watched facts once a day. Render's free web service sleeps when idle, so a timer inside the app
# can't be trusted; this job wakes it and asks it to re-check a bounded batch of due watches.
#
# Needs the repository secret CRON_SECRET (Settings > Secrets and variables > Actions), set to the same value
# as CRON_SECRET on Render. Optional repository variable NEKO_URL (defaults to the live site).

name: Re-check watched facts

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC (off the hour, when GitHub's scheduler is less busy)
  workflow_dispatch: {}

permissions: {}

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call the re-check endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEKO_URL: ${{ vars.NEKO_URL || 'https://neko-qt6g.onrender.com' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::notice::CRON_SECRET is not set for this repository, so there is nothing to call."
            exit 0
          fi
          # The first request may wake a sleeping free instance, which can take a minute.
          curl -fsS --retry 3 --retry-delay 30 --retry-all-errors --max-time 300 "$NEKO_URL/healthz" > /dev/null
          curl -fsS --max-time 300 -X POST -H "Authorization: Bearer $CRON_SECRET" "$NEKO_URL/api/cron/recheck"
          echo
