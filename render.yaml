# Render blueprint: the web app (built from the Dockerfile) plus a managed Postgres.
# In Render: New > Blueprint > pick this repo. It asks for GEMINI_API_KEY; everything else is set here.

services:
  - type: web
    name: neko
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: GEMINI_API_KEY
        sync: false # Render prompts for it; it is never stored in the repo
      - key: DATABASE_URL
        fromDatabase:
          name: neko-db
          property: connectionString
      - key: TRUST_PROXY # Render's proxy puts the visitor's address in X-Forwarded-For
        value: "true"
      - key: TURNS_PER_HOUR
        value: "20"
      - key: TURNS_PER_DAY
        value: "400"
      - key: NEW_USERS_PER_IP_PER_HOUR
        value: "10"
      # "Watch this". Set CRON_SECRET (and the same value as the GitHub Actions secret CRON_SECRET) to turn on
      # the daily re-check. Set RESEND_API_KEY and EMAIL_FROM to send change emails. All optional.
      - key: CRON_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

databases:
  - name: neko-db
    plan: free
    databaseName: neko
    user: neko
