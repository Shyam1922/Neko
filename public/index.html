<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recall</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar" aria-label="Chat history">
      <div class="brand">Recall</div>
      <button id="new-chat" type="button">+ New chat</button>
      <nav id="history" aria-label="Recent chats"></nav>
      <button id="open-profile" type="button">What I know about you</button>
    </aside>
    <div id="scrim"></div>

    <section id="main" class="empty">
      <header>
        <button id="menu" type="button" aria-label="Show chat history">☰</button>
      </header>

      <div id="landing">
        <h1 id="greeting">Hello</h1>
        <p>I remember what we've talked about, check the web, and tell you what's changed.</p>
      </div>

      <main id="log" aria-live="polite"></main>

      <form id="form">
        <textarea id="input" rows="1" placeholder="Ask anything…" autofocus></textarea>
        <button id="send" type="submit" aria-label="Send">↑</button>
      </form>

      <div id="chips"></div>
    </section>
  </div>
  <dialog id="profile-dialog" aria-labelledby="profile-title">
    <div class="dlg-head">
      <h2 id="profile-title">What I know about you</h2>
      <button id="profile-close" type="button" aria-label="Close">×</button>
    </div>
    <p class="hint">I only save things you tell me outright, in your own words. Edit or remove anything here.</p>
    <div id="profile-list"></div>
    <form id="profile-add" autocomplete="off">
      <input id="add-key" list="key-suggestions" placeholder="Label, e.g. Team size" maxlength="30" aria-label="Label" required>
      <input id="add-value" placeholder="Value, e.g. 20 people" maxlength="120" aria-label="Value" required>
      <button type="submit">Add</button>
    </form>
    <datalist id="key-suggestions">
      <option value="Name"><option value="Role"><option value="Company"><option value="Team size"><option value="Budget">
      <option value="Location"><option value="Currency"><option value="Answer length"><option value="Answer format">
    </datalist>
    <p id="profile-error" class="hint err" hidden></p>
    <div class="dlg-foot"><button id="profile-clear" type="button">Forget everything</button></div>
  </dialog>
  <script src="/app.js"></script>
</body>
</html>
