<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recall</title>
  <script>
    // Apply the saved theme before the first paint, so there is no flash of the wrong one.
    try {
      var t = localStorage.getItem("recall-theme");
      var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar" aria-label="Chat history">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 8v4l3 2"/></svg>
        </span>
        <span>Recall</span>
      </div>
      <button id="new-chat" type="button">+ New chat</button>
      <div class="side-label">Chats</div>
      <nav id="history" aria-label="Recent chats"></nav>
    </aside>
    <div id="scrim"></div>

    <section id="main" class="empty">
      <header id="topbar">
        <button id="menu" type="button" aria-label="Show chat history">☰</button>
        <div id="chat-title"></div>
        <button id="open-profile" type="button" aria-label="Your profile and what I remember about you">
          <span class="who">
            <span id="who-name">Your profile</span>
            <span id="who-sub">Nothing remembered yet</span>
          </span>
          <span id="avatar" aria-hidden="true"></span>
        </button>
      </header>

      <div id="landing">
        <p id="greeting" class="eyebrow">Hello</p>
        <h1>What should we look into?</h1>
        <p class="sub">I remember past chats, check the live web, and tell you what changed.</p>
      </div>

      <main id="log" aria-live="polite"></main>

      <form id="form">
        <textarea id="input" rows="1" placeholder="Ask anything, or ask what changed since last time…" autofocus></textarea>
        <button id="send" type="submit" aria-label="Send">Send</button>
      </form>
      <p id="status-line"></p>
    </section>
  </div>

  <dialog id="profile-dialog" aria-labelledby="profile-title">
    <div class="dlg-head">
      <h2 id="profile-title">Your profile</h2>
      <button id="profile-close" type="button" aria-label="Close">×</button>
    </div>

    <p class="dlg-sec">Appearance</p>
    <div id="theme-seg" role="radiogroup" aria-label="Theme">
      <button type="button" role="radio" data-theme-pref="light" aria-checked="false">Light</button>
      <button type="button" role="radio" data-theme-pref="dark" aria-checked="false">Dark</button>
      <button type="button" role="radio" data-theme-pref="system" aria-checked="true">System</button>
    </div>

    <p class="dlg-sec">What I know about you</p>
    <p class="hint">I only save things you tell me outright, in your own words. Edit or remove anything here.</p>
    <div id="profile-list"></div>
    <p id="profile-error" class="hint err" hidden></p>
    <div class="dlg-foot"><button id="profile-clear" type="button">Forget everything</button></div>
  </dialog>
  <script src="/app.js"></script>
</body>
</html>
